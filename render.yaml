services:
  - type: web
    name: olx-liquidity-bot
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MY_CHAT_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/liquidity.db
      - key: SCRAPE_ENABLED
        value: "true"
    disk:
      name: liquidity-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
